<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💖 Valentine Wordle 💖</title>
  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(22, 1fr);
      gap: 4px;
    }

    .tile {
      width: 30px;
      height: 40px;
      border: 2px solid #ffc0cb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 6px;
      background: #fff0f5;
    }

    .correct {
      background: #ff4d6d;
      color: white;
    }

    .present {
      background: #ffb703;
      color: white;
    }

    .absent {
      background: #d3d3d3;
      color: white;
    }

    .message {
      margin-top: 15px;
      font-size: 18px;
      color: #ff4d6d;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>💖 Valentine Wordle 💖</h1>
    <p>Type your guess & press Enter 💌</p>

    <div class="grid" id="grid"></div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const ANSWER = "willyoubemykategitine";
    const MAX_GUESSES = 6;

    let currentRow = 0;
    let currentCol = 0;
    let guesses = Array(MAX_GUESSES).fill("");

    const grid = document.getElementById("grid");
    const message = document.getElementById("message");

    // Build grid
    for (let i = 0; i < MAX_GUESSES; i++) {
      const row = document.createElement("div");
      row.className = "row";

      for (let j = 0; j < ANSWER.length; j++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        row.appendChild(tile);
      }

      grid.appendChild(row);
    }

    document.addEventListener("keydown", handleKey);

    function handleKey(e) {
      if (currentRow >= MAX_GUESSES) return;

      if (e.key === "Backspace") {
        if (currentCol > 0) {
          currentCol--;
          guesses[currentRow] =
            guesses[currentRow].slice(0, -1);
          updateTile("", currentRow, currentCol);
        }
        return;
      }

      if (e.key === "Enter") {
        if (currentCol === ANSWER.length) {
          submitGuess();
        }
        return;
      }

      if (/^[a-zA-Z]$/.test(e.key)) {
        if (currentCol < ANSWER.length) {
          guesses[currentRow] += e.key.toLowerCase();
          updateTile(e.key, currentRow, currentCol);
          currentCol++;
        }
      }
    }

    function updateTile(letter, row, col) {
      const tile = grid.children[row].children[col];
      tile.textContent = letter;
    }

    function submitGuess() {
      const guess = guesses[currentRow];
      const row = grid.children[currentRow];
      const answerArray = ANSWER.split("");

      for (let i = 0; i < ANSWER.length; i++) {
        const tile = row.children[i];

        if (guess[i] === ANSWER[i]) {
          tile.classList.add("correct");
        } else if (answerArray.includes(guess[i])) {
          tile.classList.add("present");
        } else {
          tile.classList.add("absent");
        }
      }

      if (guess === ANSWER) {
        message.innerHTML =
          "💖 YES!!! Will you be my Kategitine? 💖<br>Happy Valentine’s Day 💘";
        currentRow = MAX_GUESSES;
        return;
      }

      currentRow++;
      currentCol = 0;

      if (currentRow === MAX_GUESSES) {
        message.textContent =
          "💔 Out of guesses… but my heart is still yours 💕";
      }
    }
  </script>
</body>
</html>
