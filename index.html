<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💖 Valentine Wordle 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      width: 95%;
      max-width: 420px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 5px;
    }

    .subtitle {
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
    }

    .tile {
      aspect-ratio: 1 / 1.2;
      border: 2px solid #ffc0cb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 8px;
      background: #fff0f5;
    }

    .correct {
      background: #ff4d6d;
      color: white;
    }

    .present {
      background: #ffb703;
      color: white;
    }

    .absent {
      background: #d3d3d3;
      color: white;
    }

    .message {
      margin-top: 15px;
      font-size: 18px;
      color: #ff4d6d;
    }

    /* Hidden input to trigger mobile keyboard */
    #hiddenInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="game" onclick="focusInput()">
    <h1>💖 Valentine Wordle 💖</h1>
    <div class="subtitle">Will you be my</div>

    <div class="grid" id="grid"></div>

    <div class="message" id="message"></div>
  </div>

  <!-- Hidden input for mobile keyboard -->
  <input id="hiddenInput" autocomplete="off" />

  <script>
    const ANSWER = "kategitine";
    const MAX_GUESSES = 6;

    let currentRow = 0;
    let currentCol = 0;
    let guesses = Array(MAX_GUESSES).fill("");

    const grid = document.getElementById("grid");
    const message = document.getElementById("message");
    const hiddenInput = document.getElementById("hiddenInput");

    // Build grid
    for (let i = 0; i < MAX_GUESSES; i++) {
      const row = document.createElement("div");
      row.className = "row";

      for (let j = 0; j < ANSWER.length; j++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        row.appendChild(tile);
      }

      grid.appendChild(row);
    }

    function focusInput() {
      hiddenInput.focus();
    }

    document.addEventListener("keydown", handleKey);

    function handleKey(e) {
      if (currentRow >= MAX_GUESSES) return;

      if (e.key === "Backspace") {
        if (currentCol > 0) {
          currentCol--;
          guesses[currentRow] =
            guesses[currentRow].slice(0, -1);
          updateTile("", currentRow, currentCol);
        }
        return;
      }

      if (e.key === "Enter") {
        if (currentCol === ANSWER.length) {
          submitGuess();
        }
        return;
      }

      if (/^[a-zA-Z]$/.test(e.key)) {
        if (currentCol < ANSWER.length) {
          guesses[currentRow] += e.key.toLowerCase();
          updateTile(e.key, currentRow, currentCol);
          currentCol++;
        }
      }
    }

    function updateTile(letter, row, col) {
      grid.children[row].children[col].textContent = letter;
    }

    function submitGuess() {
      const guess = guesses[currentRow];
      const row = grid.children[currentRow];
      const answerArray = ANSWER.split("");

      for (let i = 0; i < ANSWER.length; i++) {
        const tile = row.children[i];

        if (guess[i] === ANSWER[i]) {
          tile.classList.add("correct");
        } else if (answerArray.includes(guess[i])) {
          tile.classList.add("present");
        } else {
          tile.classList.add("absent");
        }
      }

      if (guess === ANSWER) {
        message.innerHTML =
          "💖 YES!!! 💖<br>Happy Valentine’s Day 💘";
        currentRow = MAX_GUESSES;
        return;
      }

      currentRow++;
      currentCol = 0;

      if (currentRow === MAX_GUESSES) {
        message.textContent =
          "💔 Out of guesses… but the answer is still KATEGITINE 💕";
      }
    }

    // Auto-focus on load (helps mobile)
    focusInput();
  </script>
</body>
</html>
